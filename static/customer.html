<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mehul Electro Insulating Industries — My Orders</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#18181b">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="sidebar-brand">
      <img src="/logo.png" alt="Mehul Electro Insulating Industries">
    </div>
    <div class="sidebar-nav">
      <div class="sidebar-group">
        <div class="sidebar-label">Portal</div>
        <button class="nav-link active" data-tab="new">
          <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg>
          New Request
        </button>
        <button class="nav-link" data-tab="requests">
          <svg viewBox="0 0 16 16"><path d="M2 3h12M2 8h12M2 13h12"/></svg>
          My Requests
        </button>
      </div>
    </div>
  </div>

  <div class="main-col">
    <div class="topbar">
      <div class="breadcrumb">
        <span class="seg" id="companyName">Portal</span>
        <span class="sep">/</span>
        <span class="current" id="breadcrumbCurrent">New Request</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" id="logoutBtn">Log out</button>
        <div class="avatar" id="avatarInitial">C</div>
      </div>
    </div>

    <div class="content">
      <div id="tab-new">
        <h2 class="page-title">New Request</h2>
        <div class="card">
          <div id="formMsg"></div>
          <form id="reqForm">
            <div class="row2">
              <div class="field">
                <label>Product / Material *</label>
                <input type="text" id="material" placeholder="e.g. Epoxy resin sheet, Mica tape" required>
              </div>
              <div class="field">
                <label>Quantity</label>
                <div class="hstack">
                  <input type="text" id="quantity" placeholder="e.g. 500" style="flex:1">
                  <select id="unit" style="flex:1">
                    <option value="kg" selected>kg</option>
                    <option value="mtr">mtr</option>
                    <option value="pcs">pcs</option>
                    <option value="ltr">ltr</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="field">
              <label>Specifications</label>
              <textarea id="specs" placeholder="Thickness, grade, dimensions, thermal class, etc."></textarea>
            </div>
            <div class="field">
              <label>Additional Notes</label>
              <textarea id="notes" placeholder="Delivery timeline, delivery location, or anything else we should know"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Requirement</button>
          </form>
        </div>
      </div>

      <div id="tab-requests" style="display:none">
        <h2 class="page-title">My Requests</h2>
        <div class="card">
          <div id="requestsList" class="empty-state">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
let me = null;

document.querySelectorAll(".nav-link[data-tab]").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".nav-link[data-tab]").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.tab;
    document.getElementById("tab-new").style.display = target === "new" ? "block" : "none";
    document.getElementById("tab-requests").style.display = target === "requests" ? "block" : "none";
    document.getElementById("breadcrumbCurrent").textContent = target === "new" ? "New Request" : "My Requests";
    if (target === "requests") loadRequests();
  });
});

function renderRequests(requests) {
  const container = document.getElementById("requestsList");
  const rows = requests.length
    ? requests.map((r) => `
      <tr>
        <td data-label="Material"><strong>${escapeHtml(r.material)}</strong>${r.specs ? `<div class="muted">${escapeHtml(r.specs)}</div>` : ""}</td>
        <td data-label="Quantity">${escapeHtml(r.quantity)} ${escapeHtml(r.unit)}</td>
        <td data-label="Submitted">${formatDate(r.created_at)}</td>
        <td data-label="Status"><span class="badge badge-${r.status}">${statusLabel(r.status)}</span></td>
        <td data-label="Expected Dispatch">${r.expected_dispatch_date ? escapeHtml(formatDateOnly(r.expected_dispatch_date)) : '<span class="muted">—</span>'}</td>
        <td data-label="Transport">${r.transport_name ? escapeHtml(r.transport_name) : '<span class="muted">—</span>'}</td>
        <td data-label="LR / Tracking No.">${r.lr_number ? escapeHtml(r.lr_number) : '<span class="muted">—</span>'}</td>
        <td data-label="Notes from us">${r.admin_notes ? escapeHtml(r.admin_notes) : '<span class="muted">—</span>'}</td>
      </tr>
    `).join("")
    : `<tr class="table-empty-row"><td colspan="8">You haven't submitted any requirements yet.</td></tr>`;
  container.innerHTML = `
    <table>
      <thead><tr><th>Material</th><th>Quantity</th><th>Submitted</th><th>Status</th><th>Expected Dispatch</th><th>Transport</th><th>LR / Tracking No.</th><th>Notes from us</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadRequests() {
  try {
    const requests = await api("/api/requests");
    renderRequests(requests);
  } catch (e) {
    document.getElementById("requestsList").innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`;
  }
}

document.getElementById("reqForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgBox = document.getElementById("formMsg");
  msgBox.innerHTML = "";
  const material = document.getElementById("material").value.trim();
  if (!material) return;

  try {
    await apiJson("/api/requests", "POST", {
      material,
      quantity: document.getElementById("quantity").value.trim(),
      unit: document.getElementById("unit").value.trim(),
      specs: document.getElementById("specs").value.trim(),
      notes: document.getElementById("notes").value.trim(),
    });
    msgBox.innerHTML = '<div class="success-msg">Requirement sent. We will get back to you shortly.</div>';
    document.getElementById("reqForm").reset();
  } catch (err) {
    msgBox.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await apiJson("/api/logout", "POST", {});
  window.location.href = "/login.html";
});

(async () => {
  me = await requireAuth("customer");
  if (!me) return;
  const label = me.company_name || me.username;
  document.getElementById("companyName").textContent = label;
  document.getElementById("avatarInitial").textContent = label.charAt(0);
})();
</script>
</body>
</html>
